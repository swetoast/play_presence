[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "play-presence"
version = "0.6.9"
description = "Play Presence for RG40XX V with MQTT and Home Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["paho-mqtt>=1.5.1,<2"]
[project.scripts]
play-presence = "play_presence.__main__:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
